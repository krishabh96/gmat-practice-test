<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Sasta GMAT Prep</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0F172A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-wrap{width:100%;max-width:400px}
.login-logo{font-family:'Playfair Display',serif;font-size:24px;color:#fff;text-align:center;margin-bottom:4px}
.login-tagline{font-size:13px;color:rgba(255,255,255,0.4);text-align:center;margin-bottom:36px}
.login-card{background:#fff;border-radius:16px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.login-card-title{font-size:16px;font-weight:700;color:#0F172A;margin-bottom:4px}
.login-card-sub{font-size:13px;color:#6B7280;margin-bottom:24px}
.login-label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6B7280;margin-bottom:6px}
.login-input{width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px}
.login-input:focus{border-color:#14B8A6}
.login-btn{width:100%;padding:13px;background:#0F172A;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s}
.login-btn:hover{background:#1e293b}
.login-err{color:#EF4444;font-size:12px;margin-top:10px;text-align:center;display:none}
.login-hint{font-size:11px;color:#9CA3AF;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">Sasta GMAT Prep</div>
  <div class="login-tagline">Admin Panel</div>
  <div class="login-card">
    <div class="login-card-title">Sign In</div>
    <div class="login-card-sub">Restricted access — admins only</div>
    <label class="login-label">Password</label>
    <input class="login-input" type="password" id="pwd" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" onclick="tryLogin()">Access Admin Panel →</button>
    <div class="login-err" id="err">Incorrect password. Try again.</div>
    <div class="login-hint">Change the password in admin-shared.js before deploying</div>
  </div>
</div>
<script src="admin-shared.js"></script>
<script>
function tryLogin(){
  const pwd = document.getElementById('pwd').value.trim();
  if(adminLogin(pwd)){
    window.location.href = 'dashboard.html';
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
  }
}
document.getElementById('pwd').addEventListener('keydown', e => {
  if(e.key === 'Enter') tryLogin();
});
// Already logged in?
if(sessionStorage.getItem('admin_auth') === '1'){
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
